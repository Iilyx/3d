<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; script-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <style>
    @font-face {
      font-family: "Liber Sans";
      font-style: normal;
      font-weight: 400;
      src: url("fonts/sans-400-cyr.woff2") format("woff2"),
           url("fonts/sans-400-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Liber Sans";
      font-style: normal;
      font-weight: 500;
      src: url("fonts/sans-500-cyr.woff2") format("woff2"),
           url("fonts/sans-500-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Liber Sans";
      font-style: normal;
      font-weight: 600;
      src: url("fonts/sans-600-cyr.woff2") format("woff2"),
           url("fonts/sans-600-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Liber Sans";
      font-style: normal;
      font-weight: 700;
      src: url("fonts/sans-700-cyr.woff2") format("woff2"),
           url("fonts/sans-700-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Liber Serif";
      font-style: normal;
      font-weight: 600;
      src: url("fonts/serif-600-cyr.woff2") format("woff2"),
           url("fonts/serif-600-latin.woff2") format("woff2");
    }

    :root {
      --primary: {{PRIMARY}};
      --accent: {{ACCENT}};
      --ink: {{INK}};
      --ink-2: {{INK2}};
      --muted: {{MUTED}};
      --paper: {{PAPER}};
      --sheet: {{SHEET}};
      --rule: {{RULE}};
      --foil: {{FOIL}};
      --panel: {{PANEL}};
      --on-accent: {{ON_ACCENT}};
      --field-b: {{FIELD_B}};
      --on-field-b: {{ON_FIELD_B}};
      --rail: {{RAIL}};
      --on-rail: {{ON_RAIL}};
      --deck-primary: {{PRIMARY}};
      --deck-accent: {{ACCENT}};
      --deck-bg: {{SHEET}};
      --deck-text: {{INK}};
      --deck-panel: {{PANEL}};
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--paper);
    }
    #slide {
      width: 1920px;
      height: 1080px;
      margin: 0;
      position: relative;
      background:
        radial-gradient(900px 480px at 100% 0%, color-mix(in srgb, var(--accent) 3%, transparent), transparent 55%),
        var(--sheet);
      color: var(--ink);
      font-family: Calibri, "Segoe UI", "Liber Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #slide::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 6px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }
    .slide-inner {
      position: absolute;
      inset: 64px 88px 72px 88px;
      display: flex;
      flex-direction: column;
    }
    .brand {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .brand span { color: var(--primary); }
    h1 {
      margin: 0;
      font-family: Georgia, "Liber Serif", serif;
      font-weight: 600;
      font-size: 68px;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: var(--ink);
      max-width: 1480px;
    }
    .subtitle {
      margin-top: 24px;
      font-size: 26px;
      font-weight: 500;
      color: var(--muted);
      max-width: 1100px;
      line-height: 1.4;
    }
    .title-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 40px;
      position: relative;
    }
    /* Voltage title: Julius-like geometric foil (non-split only) */
    #slide[data-pack="voltage"][data-layout="title"] .title-stage:not(.title-stage--split):not(.title-stage--bleed):not(.title-stage--field)::after {
      content: "";
      position: absolute;
      right: 40px;
      top: 18%;
      width: 200px;
      height: 200px;
      border: 2px solid color-mix(in srgb, var(--foil) 60%, transparent);
      border-radius: 6px;
      transform: rotate(14deg);
      pointer-events: none;
      opacity: 0.65;
      z-index: 0;
    }
    #slide[data-pack="voltage"][data-layout="title"] .title-stage:not(.title-stage--split):not(.title-stage--bleed):not(.title-stage--field)::before {
      content: "";
      position: absolute;
      right: 160px;
      bottom: 16%;
      width: 110px;
      height: 110px;
      background: color-mix(in srgb, var(--accent) 28%, transparent);
      border-radius: 3px;
      pointer-events: none;
      z-index: 0;
    }
    #slide[data-pack="voltage"][data-layout="title"] .title-stage > * {
      position: relative;
      z-index: 1;
    }
    /* Signal / ink titles: slightly larger display weight */
    #slide[data-pack="signal"][data-layout="title"] h1,
    #slide[data-pack="ink"][data-layout="title"] h1 {
      font-size: 76px;
      max-width: 1320px;
    }
    .title-stage--split {
      /* Full-bleed split: ignore default slide-inner margins */
      position: absolute !important;
      display: grid !important;
      grid-template-columns: minmax(0, 0.55fr) minmax(0, 0.45fr);
      grid-template-rows: minmax(0, 1fr);
      gap: 0;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 100%;
      height: 100%;
      padding: 0 !important;
      margin: 0;
      box-sizing: border-box;
    }
    .title-stage--split .title-main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 72px 48px 80px 88px;
      min-height: 0;
      height: 100%;
      box-sizing: border-box;
    }
    .title-stage--split .title-panel {
      background: var(--panel);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-self: stretch;
      height: 100%;
      min-height: 0;
      padding: 72px 64px 80px;
      box-sizing: border-box;
    }
    .title-stage--split .title-panel .takeaway {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--ink);
      white-space: pre-line;
    }
    .hero-metrics {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 44px;
      width: 100%;
    }
    .hero-metric__value {
      margin: 0;
      font-family: Calibri, "Segoe UI", "Liber Sans", sans-serif;
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.02;
      color: var(--ink);
    }
    .hero-metric__label {
      margin: 10px 0 0;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--ink-2);
      max-width: 16em;
    }
    .title-stage--split .brand { margin-bottom: 28px; }
    .title-stage--split h1 { font-size: 56px; max-width: none; }
    /* Relay / Split Pastel: Julius-like geometric sans display */
    #slide[data-pack="relay"] h1,
    #slide[data-pack="pastel"] h1,
    #slide[data-pack="relay"] .kpi-card .value,
    #slide[data-pack="pastel"] .kpi-card .value,
    #slide[data-pack="relay"] .section-splash__title,
    #slide[data-pack="pastel"] .section-splash__title {
      font-family: Calibri, "Segoe UI", "Liber Sans", sans-serif;
      font-weight: 700;
    }
    #slide[data-layout="title"]:has(.title-stage--split)::before { display: none; }
    #slide[data-layout="title"]:has(.title-stage--split) .footer-rule { display: none; }
    .section-head {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin: 0 0 16px;
      max-width: 1480px;
      flex-shrink: 0;
    }
    #slide[data-layout="scorecard"] .section-head,
    #slide[data-layout="card_row"] .section-head {
      margin-bottom: 12px;
    }
    .section-head .kicker {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      line-height: 1.2;
    }
    .section-head .kicker::after {
      content: "";
      display: block;
      width: 48px;
      height: 2px;
      margin-top: 10px;
      background: var(--foil);
    }
    .title-stage > .kicker {
      margin: 0 0 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .section-title {
      margin: 0;
      font-family: Georgia, "Liber Serif", serif;
      font-size: 40px;
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.12;
      color: var(--ink);
    }
    .section-head:has(.kicker) .section-title {
      font-size: 44px;
      letter-spacing: -0.02em;
    }
    .section-head--compact { margin-bottom: 14px; }
    .section-head--compact .kicker { margin-bottom: 8px; font-size: 12px; }
    .section-head--compact .section-title { font-size: 36px; }
    .section-head--compact:has(.kicker) .section-title { font-size: 38px; }
    .chart-hero .section-title { font-size: 36px; }
    .chapter {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--primary);
    }
    .takeaway {
      margin: 14px 0 0;
      font-size: 20px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--ink-2);
      max-width: 1200px;
    }
    .takeaway--hero {
      margin-top: 20px;
      font-size: 24px;
      color: var(--muted);
    }
    /* Section splash — twin of PPTX side accent panel */
    .slide-inner.section-splash {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(420px, 32%);
      grid-template-rows: auto 1fr;
      gap: 0 48px;
      inset: 64px 0 72px 88px;
      padding-right: 0;
    }
    .section-splash .brand { grid-column: 1; grid-row: 1; }
    .section-splash__main {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 48px;
      max-width: 920px;
    }
    .section-splash__title {
      margin: 0;
      font-family: Georgia, "Liber Serif", serif;
      font-size: 56px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--ink);
    }
    .section-splash__sub {
      margin: 20px 0 0;
      font-size: 22px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--muted);
      max-width: 720px;
    }
    #slide[data-layout="section"] .section-splash__panel.is-sentence {
      background: var(--accent);
      color: var(--on-accent);
      justify-content: flex-start;
      align-items: center;
      padding: 64px 48px;
    }
    .section-splash__line {
      margin: 0;
      font-family: Georgia, "Liber Serif", serif;
      font-size: 36px;
      line-height: 1.25;
      color: var(--on-accent);
    }
    .section-splash__panel {
      grid-column: 2;
      grid-row: 1 / -1;
      margin: -64px 0 -72px 0;
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .section-splash__num {
      margin: 0;
      font-family: Georgia, "Liber Serif", serif;
      font-size: 96px;
      font-weight: 600;
      letter-spacing: -0.04em;
      color: var(--ink);
      line-height: 1;
    }
    .kpi-card .delta {
      display: inline-block;
      margin-top: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      width: fit-content;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
    }
    .kpi-card .delta.status-up {
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
    }
    .kpi-card .delta.status-down {
      color: var(--primary);
      background: color-mix(in srgb, var(--primary) 12%, transparent);
    }
    .kpi-card .delta.status-flat {
      color: var(--muted);
      background: color-mix(in srgb, var(--muted) 14%, transparent);
    }
    .scorecard-grid .kpi-card {
      min-height: 0;
      padding: 40px 32px 44px;
    }
    .scorecard-grid .kpi-card .value {
      font-size: 58px;
    }
    .callout-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
      margin-top: 12px;
      margin-bottom: 8px;
      padding: 56px 64px;
      background: var(--paper);
      border: 1px solid var(--accent);
      border-radius: 16px;
      max-width: 1480px;
      min-height: 280px;
      box-sizing: border-box;
    }
    .callout__term {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .callout__def {
      margin: 0;
      font-family: Georgia, "Liber Serif", serif;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.02em;
      color: var(--ink);
      max-width: 1280px;
    }
    .callout__body {
      margin: 4px 0 0;
      font-size: 22px;
      font-weight: 500;
      line-height: 1.45;
      color: var(--ink-2);
      max-width: 1100px;
    }
    .chart-hero .chart-stage {
      flex: 1;
      min-height: 520px;
      padding: 6px 10px;
    }
    .chart-hero .chart-stage img {
      width: 100%;
      height: 100%;
      max-height: 720px;
      object-fit: contain;
    }
    .table-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      gap: 16px;
    }
    table.deck-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0;
      font-size: 18px;
      background: var(--sheet);
    }
    table.deck-table.is-roomy th,
    table.deck-table.is-roomy td {
      padding: 22px 26px;
      font-size: 22px;
    }
    table.deck-table.is-dense th,
    table.deck-table.is-dense td {
      padding: 6px 10px;
      font-size: 15px;
    }
    table.deck-table.is-roomy th { font-size: 14px; }
    table.deck-table th,
    table.deck-table td {
      padding: 14px 18px;
      text-align: left;
      border: 1px solid var(--rule);
      color: var(--ink);
      vertical-align: top;
    }
    table.deck-table th {
      background: var(--primary);
      color: var(--sheet);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    table.deck-table tr:nth-child(even) td {
      background: color-mix(in srgb, var(--paper) 55%, var(--sheet));
    }
    ul.bullets {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 1480px;
    }
    ul.bullets li {
      position: relative;
      padding-left: 34px;
      font-size: 26px;
      line-height: 1.35;
      font-weight: 400;
      color: var(--ink-2);
    }
    ul.bullets li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.55em;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
    }
    .kpi-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(var(--kpi-cols, 3), minmax(0, 1fr));
      grid-auto-rows: auto;
      gap: 28px;
      align-content: start;
      align-items: start;
      margin-top: 8px;
      min-height: 0;
      padding-bottom: 8px;
    }
    .kpi-card {
      background: var(--sheet);
      border: 1px solid var(--rule);
      border-left: 3px solid var(--accent);
      border-radius: 12px;
      padding: 36px 32px 40px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: flex-start;
    }
    .kpi-card .value {
      font-family: Georgia, "Liber Serif", serif;
      font-size: 50px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--ink);
      line-height: 1.05;
    }
    .kpi-card .label {
      font-size: 20px;
      font-weight: 600;
      color: var(--ink-2);
    }
    .kpi-card .hint {
      margin-top: 4px;
      font-size: 18px;
      line-height: 1.35;
      color: var(--ink-2);
      font-weight: 500;
      max-width: 16em;
    }
    .kpi-card .kpi-main { display: flex; flex-direction: column; gap: 8px; }
    .kpi-foot {
      margin-top: 8px;
      padding-top: 18px;
      border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .status-chip {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .status-chip.is-scale { color: #1f4d12; background: #d7ecc4; }
    .status-chip.is-pause { color: #7a2e16; background: #f6d5c4; }
    .status-chip.is-hold { color: #3d4450; background: #e4e7ee; }
    .stat-hero__grid {
      flex: 1;
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 48px;
      align-items: stretch;
      min-height: 0;
    }
    .stat-hero__figure {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px 36px 12px 0;
      border-right: 1px solid var(--rule);
    }
    .stat-hero__value {
      margin: 0;
      font-family: Georgia, "Liber Serif", serif;
      font-size: 120px;
      color: var(--accent);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }
    .stat-hero__label {
      margin: 18px 0 0;
      font-size: 22px;
      font-weight: 650;
      color: var(--ink-2);
    }
    .stat-hero__delta {
      margin: 14px 0 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }
    .stat-hero__hint { margin: 8px 0 0; font-size: 18px; color: var(--muted); }
    .stat-hero__notes { display: flex; align-items: center; }
    .stat-hero__notes ul { margin: 0; }
    .stat-hero--field {
      position: absolute !important;
      inset: 0 !important;
      display: grid !important;
      grid-template-columns: 1.15fr 0.85fr;
      padding: 0 !important;
      background: var(--accent);
      color: var(--on-accent);
    }
    .stat-hero--field .stat-hero__figure,
    .stat-hero--field .stat-hero__notes {
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 0;
      padding: 88px 72px;
    }
    .stat-hero--field .stat-hero__notes {
      background: var(--rail);
      color: var(--on-rail);
      align-items: flex-start;
    }
    #slide[data-layout="stat_hero"] .stat-hero--field .brand span,
    .stat-hero--field .brand,
    .stat-hero--field .brand span,
    .stat-hero--field .stat-hero__value,
    .stat-hero--field .stat-hero__label,
    .stat-hero--field .stat-hero__delta,
    .stat-hero--field .stat-hero__hint { color: var(--on-accent); }
    .stat-hero--field .stat-hero__value { font-size: 168px; }
    .stat-hero--field .stat-hero__label { font-size: 28px; opacity: 0.88; }
    .stat-hero--field ul.bullets li { color: inherit; font-size: 28px; }
    .stat-hero--field ul.bullets li::before { background: currentColor; }
    #slide:has(.stat-hero--field) { background: var(--accent); }
    #slide:has(.stat-hero--field)::before,
    #slide:has(.stat-hero--field)::after,
    #slide:has(.stat-hero--field) .footer-rule { display: none; }
    #slide:has(.stat-hero--field) .footer-mark { color: var(--on-rail); }
    .bullets--bands {
      counter-reset: band;
      gap: 16px;
      margin-top: 28px;
    }
    ul.bullets.bullets--bands li {
      counter-increment: band;
      display: grid;
      grid-template-columns: 72px 1fr;
      align-items: center;
      gap: 16px;
      padding: 22px 28px;
      background: var(--paper);
      border-left: 6px solid var(--accent);
      font-size: 30px;
      color: var(--ink);
    }
    ul.bullets.bullets--bands li::before {
      content: counter(band, decimal-leading-zero);
      position: static;
      width: auto;
      height: auto;
      border-radius: 0;
      background: none;
      font-family: Georgia, "Liber Serif", serif;
      font-size: 28px;
      color: var(--accent);
    }
    .slide-inner.closing-stage--split {
      inset: 0;
      margin: 0;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      padding: 0;
    }
    .closing-plaque {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 72px 64px;
      min-height: 0;
    }
    .closing-plaque--a { background: var(--accent); color: var(--on-accent); }
    .closing-plaque--b { background: var(--rail); color: var(--on-rail); }
    .closing-plaque .brand,
    .closing-plaque__title,
    .closing-plaque--a .closing-hero__value,
    .closing-plaque--a .closing-hero__label { color: var(--on-accent); }
    .closing-plaque__title {

    #slide[data-pack="ink"] table.deck-table th {

    #slide[data-pack="ink"] .chart-stage {

    #slide[data-pack="relay"] .kpi-card .value,
    #slide[data-pack="pastel"] .kpi-card .value {
      font-size: 48px;
    }
    #slide[data-pack="relay"] .narr-card,
    #slide[data-pack="pastel"] .narr-card {
      border: none;
      border-radius: 16px;
      min-height: 340px;
    }
    #slide[data-pack="relay"] .narr-gate,
    #slide[data-pack="pastel"] .narr-gate {
      color: var(--primary);
      letter-spacing: 0.14em;
    }
    #slide[data-pack="relay"] .callout-box,
    #slide[data-pack="pastel"] .callout-box {

    #slide[data-pack="relay"] table.deck-table th,
    #slide[data-pack="pastel"] table.deck-table th {

    #slide[data-pack="pastel"] .section-head .kicker::after {

    #slide[data-pack="relay"] .hero-metric__value,
    #slide[data-pack="pastel"] .hero-metric__value {
      font-size: 52px;
      font-weight: 700;
    }

    /* Dark Botanical (VESPER DNA) */
    #slide[data-pack="botanical"] {
      background:
        linear-gradient(0deg, color-mix(in srgb, var(--sheet) 55%, transparent), color-mix(in srgb, var(--sheet) 55%, transparent)),

        var(--sheet);
      color: var(--ink);

    #slide[data-pack="botanical"] .kicker {

      letter-spacing: 0.18em;

    #slide[data-pack="botanical"] h1,
    #slide[data-pack="botanical"] .section-splash__title {
      font-family: Georgia, "Liber Serif", serif;
      font-weight: 600;
      color: var(--ink);
    }
    #slide[data-pack="botanical"] .kpi-card,
    #slide[data-pack="botanical"] .callout-box,
    #slide[data-pack="botanical"] .narr-card {
      background: var(--paper);
      border: 1px solid color-mix(in srgb, var(--foil) 45%, transparent);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
    }
    #slide[data-pack="botanical"] .kpi-card {
      border-left: 2px solid var(--foil);
      min-height: 230px;
    }
    #slide[data-pack="botanical"] .kpi-card .value {
      font-size: 48px;
      color: var(--ink);
    }
    #slide[data-pack="botanical"] .callout-box {
      min-height: 420px;
      justify-content: center;
    }
    #slide[data-pack="botanical"] .section-head .kicker::after {
      width: 72px;
      height: 2px;
      background: var(--foil);
    }
    #slide[data-pack="botanical"] .narr-card {
      min-height: 340px;
      border-radius: 12px;
    }
    #slide[data-pack="botanical"] table.deck-table th {
      background: #192D25;
      color: var(--ink);
      border-color: #2A4036;
    }
    #slide[data-pack="botanical"] table.deck-table td {
      background: color-mix(in srgb, var(--paper) 80%, transparent);
      border-color: #2A4036;
    }
    #slide[data-pack="botanical"] .chart-stage {
      background: color-mix(in srgb, var(--paper) 88%, transparent);
      border-color: color-mix(in srgb, var(--foil) 35%, transparent);
    }
    #slide[data-pack="botanical"] .title-main--bleed h1 {
      font-size: 64px;
      max-width: 720px;
    }
    .narr-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(var(--narr-cols, 3), minmax(0, 1fr));
      gap: 28px;
      margin-top: 8px;
      align-content: stretch;
      align-items: stretch;
      min-height: 0;
      padding-bottom: 8px;
    }
    .narr-card {
      background: var(--paper);
      border-radius: 10px;
      padding: 28px 26px 32px;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .narr-card.is-metered {
      min-height: 460px;
    }
    .narr-card__title {
      font-size: 30px;
    }
    .narr-card__kicker {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--foil);
    }
    /* Percent / short metric kickers read as display numbers */
    .narr-card__kicker:is(
      :lang(en),
      :lang(ru)
    ) {
      letter-spacing: 0.04em;
    }
    .narr-card:has(.narr-card__kicker) .narr-card__kicker {
      font-family: Calibri, "Segoe UI", "Liber Sans", sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-transform: none;
    }
    .narr-card__title {
      margin: 0;
      font-family: Georgia, "Liber Serif", serif;
      font-size: 30px;
      font-weight: 600;
      line-height: 1.18;
      color: var(--ink);
    }
    .narr-card__body {
      margin: 0;
      font-size: 20px;
      line-height: 1.45;
      color: var(--muted);
    }
    .narr-gate {
      margin: 28px 0 0;
      padding-top: 18px;
      border-top: 1px solid color-mix(in srgb, var(--foil) 35%, var(--rule));
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--foil);
    }
    .closing-stage .bullets {
      margin-top: 12px;
      max-width: 1100px;
    }
    .closing-stage .section-title {
      font-size: 56px;
      letter-spacing: -0.025em;
    }
    /* Dark packs: deeper sheet wash + quieter chrome */
    #slide[data-pack="signal"],
    #slide[data-pack="ink"],
    #slide[data-pack="voltage"] {
      background:
        radial-gradient(1000px 520px at 88% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 55%),
        radial-gradient(700px 400px at 0% 100%, color-mix(in srgb, var(--foil) 8%, transparent), transparent 50%),
        var(--sheet);
    }
    #slide[data-pack="atelier"] {
      background:
        radial-gradient(900px 480px at 100% 0%, color-mix(in srgb, var(--accent) 5%, transparent), transparent 55%),
        var(--sheet);
    }
    #slide[data-pack="board"] {
      background:
        radial-gradient(820px 460px at 100% 0%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 58%),
        var(--sheet);
    }
    #slide[data-pack="studio"] {
      background:
        radial-gradient(780px 420px at 100% 0%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 55%),
        var(--sheet);
    }
    /* Voltage metric kickers (68% style) + meters */
    #slide[data-pack="voltage"] .narr-card__kicker,
    #slide[data-pack="voltage"] .narr-card__kicker.is-pct {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -0.035em;
      color: var(--foil);
      text-transform: none;
      line-height: 1;
    }
    #slide[data-pack="voltage"] .narr-card__title {
      font-size: 28px;
    }
    #slide[data-pack="voltage"] .narr-meter {
      height: 6px;
      margin: 8px 0 22px;
      max-width: none;
      background: color-mix(in srgb, var(--foil) 16%, transparent);
    }
    #slide[data-pack="voltage"] .narr-meter > i {
      background: var(--foil);
      box-shadow: 0 0 14px color-mix(in srgb, var(--foil) 50%, transparent);
    }
    /* Narr meters (any pack with % kickers) */
    .narr-meter {
      height: 7px;
      width: 100%;
      max-width: none;
      border-radius: 999px;
      background: color-mix(in srgb, var(--rule) 80%, var(--ink) 12%);
      overflow: hidden;
      margin: 10px 0 16px;
    }
    #slide[data-pack="signal"] .narr-meter,
    #slide[data-pack="ink"] .narr-meter,
    #slide[data-pack="botanical"] .narr-meter {
      background: color-mix(in srgb, var(--foil, var(--accent)) 22%, transparent);
    }
    .narr-meter > i {
      display: block;
      height: 100%;
      width: calc(var(--pct, 0) * 1%);
      max-width: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--foil, var(--accent)));
    }
    .narr-card.is-metered .narr-card__kicker.is-pct {
      font-family: Calibri, "Segoe UI", "Liber Sans", sans-serif;
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -0.035em;
      text-transform: none;
      line-height: 1;
      color: var(--foil, var(--accent));
    }
    .narr-card.is-metered {
      justify-content: flex-start;
      gap: 10px;
    }
    /* Closing hero number (Julius finale) */
    .closing-hero {
      margin: 8px 0 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .closing-hero__value {
      margin: 0;
      font-family: Georgia, "Liber Serif", serif;
      font-size: 112px;
      font-weight: 600;
      letter-spacing: -0.045em;
      line-height: 0.92;
      color: var(--ink);
    }
    .closing-hero__label {
      margin: 0;
      font-size: 24px;
      font-weight: 500;
      color: var(--muted);
      max-width: 28em;
    }
    .closing-stage ul.bullets {
      margin-top: 8px;
      max-width: 42em;
    }
    .closing-stage ul.bullets li {
      font-size: 24px;
    }
    #slide[data-pack="signal"] .closing-hero__value,
    #slide[data-pack="voltage"] .closing-hero__value,
    #slide[data-pack="ink"] .closing-hero__value {
      color: var(--foil, var(--accent));
    }
    /* Film grain on dark packs — less “flat PNG” */
    #slide[data-pack="signal"]::after,
    #slide[data-pack="ink"]::after,
    #slide[data-pack="voltage"]::after,
    #slide[data-pack="botanical"]::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      opacity: 0.14;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      background-size: 160px 160px;
    }
    /* Signal title foil mark */
    #slide[data-pack="signal"][data-layout="title"] .title-stage:not(.title-stage--split):not(.title-stage--bleed):not(.title-stage--field)::after {
      content: "";
      position: absolute;
      right: 96px;
      top: 22%;
      width: 4px;
      height: 160px;
      background: var(--foil);
      border-radius: 2px;
      opacity: 0.85;
      pointer-events: none;
    }
    /* Board scorecard: taller premium cells */
    #slide[data-pack="board"] .scorecard-grid .kpi-card {
      min-height: 0;
      border-radius: 12px;
      box-shadow: 0 8px 24px color-mix(in srgb, var(--primary) 6%, transparent);
    }
    #slide[data-pack="board"] .scorecard-grid .kpi-card .value {
      font-size: 60px;
    }
    /* Atelier: softer paper cards */
    #slide[data-pack="atelier"] .kpi-card,
    #slide[data-pack="atelier"] .narr-card {
      border: none;
      border-radius: 14px;
      box-shadow: 0 10px 28px color-mix(in srgb, var(--primary) 8%, transparent);
    }
    #slide[data-pack="atelier"] .kpi-card {
      border-left: 3px solid var(--accent);
    }
    /* Studio: ice panels */
    #slide[data-pack="studio"] .title-stage--split .title-panel {
      background: color-mix(in srgb, var(--panel) 92%, var(--accent));
    }
    #slide[data-pack="studio"] .scorecard-grid .kpi-card .value {
      font-size: 56px;
      color: var(--primary);
    }
    /* Relay pastel: softer scorecards */
    #slide[data-pack="relay"] .scorecard-grid .kpi-card,
    #slide[data-pack="pastel"] .scorecard-grid .kpi-card {
      min-height: 0;
      padding: 40px 28px;
    }
    #slide[data-pack="relay"] .closing-hero__value,
    #slide[data-pack="pastel"] .closing-hero__value {
      font-family: Calibri, "Segoe UI", "Liber Sans", sans-serif;
      font-weight: 700;
    }
    /* Signal: hotter delta chips */
    #slide[data-pack="signal"] .kpi-card .delta {
      background: color-mix(in srgb, var(--foil) 18%, transparent);
      color: var(--foil);
    }
    /* Section splash: larger chapter numeral */
    .section-splash__num {
      font-size: 120px;
      opacity: 0.92;
    }
    table.deck-table {
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      border-radius: 12px;
    }
    table.deck-table th:first-child { border-top-left-radius: 12px; }
    table.deck-table th:last-child { border-top-right-radius: 12px; }
    /*
      Bleed must stay position:absolute. `.title-stage { position: relative }`
      (for foil marks) otherwise overrides `.slide-inner` absolute and the
      stage collapses to content height — photo only fills the top third.
    */
    .title-stage--bleed {
      position: absolute !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 100%;
      height: 100%;
      padding: 0 !important;
      margin: 0;
      display: block;
      box-sizing: border-box;
    }
    .title-bleed {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }
    .title-bleed img {
      position: absolute;
      right: 0;
      top: 0;
      width: 78%;
      height: 100%;
      object-fit: cover;
      object-position: center right;
    }
    .title-bleed__veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        var(--sheet) 0%,
        color-mix(in srgb, var(--sheet) 92%, transparent) 38%,
        color-mix(in srgb, var(--sheet) 35%, transparent) 62%,
        transparent 100%
      );
    }
    .title-main--bleed {
      position: relative;
      z-index: 1;
      max-width: 820px;
      height: 100%;
      padding: 72px 48px 80px 88px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
    }
    #slide[data-pack="botanical"] .footer-mark { color: var(--muted); }
    #slide[data-layout="title"]:has(.title-stage--bleed) .footer-rule { display: none; }

    /* ——— Pack DNA: blocks look different, not just recolored ——— */
    /* Board: sharp navy tables, teal rules, executive density */
    #slide[data-pack="board"] .kpi-card {
      border-radius: 6px;
      border-left-width: 4px;
    }
    #slide[data-pack="board"] .narr-card {
      border-radius: 6px;
      border: 1px solid var(--rule);
      border-left: 4px solid var(--accent);
    }
    #slide[data-pack="board"] .callout-box {
      border-radius: 6px;
      border-width: 2px;
      border-color: var(--accent);
    }
    #slide[data-pack="board"] table.deck-table {
      border-radius: 0;
    }
    #slide[data-pack="board"] table.deck-table th {
      border-radius: 0 !important;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 14px;
    }

    /* Signal: charcoal cards, orange foil left only, no soft pastel */
    #slide[data-pack="signal"] .kpi-card,
    #slide[data-pack="signal"] .narr-card {
      border-radius: 2px;
      border-top: none;
      border-right: none;
      border-bottom: none;
      border-left: 4px solid var(--foil);
    }
    #slide[data-pack="signal"] .callout-box {
      border-radius: 2px;
      border-width: 1px 1px 1px 4px;
      border-color: var(--foil);
    }
    #slide[data-pack="signal"] table.deck-table th {
      border-radius: 0 !important;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #slide[data-pack="signal"] .section-title,
    #slide[data-pack="signal"] h1 {
      font-family: Georgia, "Liber Serif", serif;
    }

    /* Relay / pastel: soft pills, no left bars, panel fills */
    #slide[data-pack="relay"] .kpi-card,
    #slide[data-pack="pastel"] .kpi-card,
    #slide[data-pack="relay"] .narr-card,
    #slide[data-pack="pastel"] .narr-card {
      border: none !important;
      border-left: none !important;
      border-radius: 20px;
      box-shadow: none;
    }
    #slide[data-pack="relay"] .callout-box,
    #slide[data-pack="pastel"] .callout-box {
      border: none !important;
      border-radius: 24px;
    }
    #slide[data-pack="relay"] .section-splash__panel,
    #slide[data-pack="pastel"] .section-splash__panel {
      border-radius: 0;
    }
    #slide[data-pack="relay"] h1,
    #slide[data-pack="pastel"] h1,
    #slide[data-pack="relay"] .section-title,
    #slide[data-pack="pastel"] .section-title {
      font-family: Calibri, "Segoe UI", "Liber Sans", sans-serif;
      font-weight: 700;
    }

    /* Voltage: sharp geometry, top accent only, lime meters */
    #slide[data-pack="voltage"] .kpi-card,
    #slide[data-pack="voltage"] .narr-card,
    #slide[data-pack="voltage"] .callout-box {
      border-radius: 0;
    }
    #slide[data-pack="voltage"] .narr-card {
      border: 1px solid var(--rule);
      border-top: 3px solid var(--foil);
      border-left: none;
    }
    #slide[data-pack="voltage"] .kpi-card {
      border-left: none;
      border-top: 3px solid var(--foil);
    }
    #slide[data-pack="voltage"] table.deck-table {
      border-radius: 0;
    }
    #slide[data-pack="voltage"] .section-title {
      font-family: Georgia, "Liber Serif", serif;
    }

    /* Ink: sparse ice — large type, soft cards, minimal borders */
    #slide[data-pack="ink"] .kpi-card,
    #slide[data-pack="ink"] .narr-card {
      border: none;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }
    #slide[data-pack="ink"] .callout-box {
      border-radius: 18px;
      border-width: 1px;
      min-height: 480px;
    }
    #slide[data-pack="ink"] .section-splash__title,
    #slide[data-pack="ink"] h1 {
      font-size: 72px;
      max-width: 1100px;
    }
    #slide[data-pack="ink"] .scorecard-grid {
      gap: 36px;
    }

    /* Botanical: foil frames, moss panels, soft radius */
    #slide[data-pack="botanical"] .kpi-card,
    #slide[data-pack="botanical"] .narr-card,
    #slide[data-pack="botanical"] .callout-box {
      border-radius: 14px;
      border: 1px solid color-mix(in srgb, var(--foil) 50%, transparent);
      border-left: 1px solid color-mix(in srgb, var(--foil) 50%, transparent);
      background: color-mix(in srgb, var(--paper) 88%, transparent);
    }
    #slide[data-pack="botanical"] .section-splash__title {
      font-style: italic;
    }
    #slide[data-pack="botanical"] table.deck-table th {
      background: color-mix(in srgb, var(--primary) 70%, var(--foil));
      letter-spacing: 0.04em;
    }

    /* Atelier: editorial olive — soft paper chips */
    #slide[data-pack="atelier"] .kpi-card {
      border-radius: 12px;
      border: none;
      border-left: 3px solid var(--accent);
      background: var(--paper);
    }
    #slide[data-pack="atelier"] .narr-card {
      border: none;
      border-radius: 12px;
      border-top: 2px solid var(--foil);
    }
    #slide[data-pack="atelier"] .callout-box {
      border-radius: 12px;
      border-color: var(--foil);
    }
    #slide[data-pack="atelier"] .bullets li::before {
      background: var(--accent);
    }

    /* Studio: ice workshop — numbered feel, soft indigo */
    #slide[data-pack="studio"] .kpi-card,
    #slide[data-pack="studio"] .narr-card {
      border: none;
      border-radius: 16px;
      background: var(--paper);
      box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 10%, transparent);
    }
    #slide[data-pack="studio"] .narr-card__kicker {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 0.1em;
    }
    #slide[data-pack="studio"] .callout-box {
      border-radius: 16px;
      border: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent);
      background: color-mix(in srgb, var(--paper) 70%, white);

    #slide[data-pack="studio"] table.deck-table th {
      background: var(--accent);
    }
    #slide[data-layout="scorecard"] .scorecard-grid .kpi-card,
    #slide[data-layout="kpi_row"] .kpi-grid .kpi-card {
      min-height: 0;
      height: auto;
    }
    #slide[data-layout="bullets"] .bullets-stage,
    #slide[data-layout="bullets"] .slide-inner {
      justify-content: center;
    }
    h1.is-short, .section-title.is-short, .section-splash__title.is-short { font-size: 64px; }
    h1.is-long, .section-title.is-long, .section-splash__title.is-long {
      font-size: 32px;
      line-height: 1.2;
    }
    #slide[data-layout="quote"] .slide-inner { justify-content: center; }
    .slide-inner.chart-hero--field,

    #slide[data-pack="ink"] .narr-card {
