<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; }
    #mount {
      width: 1120px;
      /* Fit content — fixed 600px left empty bands under short horizontal_bar. */
      min-height: 0;
      padding: 28px 36px;
      box-sizing: border-box;
      font-family: "Segoe UI", "DejaVu Sans", sans-serif;
      color: var(--chart-ink, #0F3D3E);
      /* Vivid defaults; polish may override via #mount { --kpi-value:… } */
      --kpi-value: var(--chart-accent, #4F6B14);
      --kpi-label: var(--chart-muted, #6A7160);
      --kpi-ink: var(--chart-ink, #2E4208);
      --chart-ink: #2E4208;
      --chart-accent: #4F6B14;
      --chart-muted: #6A7160;
    }
    canvas { max-width: 100%; display: block; margin: 0 auto; }

    /* Premium card shell (LLM / coerce may wrap fragments) */
    .chart-card {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
    }
    .chart-kpi-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 0 4px 8px;
    }
    .chart-kpi-header .eyebrow {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--chart-muted, #6A7160);
    }
    .chart-kpi-header .big {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--kpi-value, var(--chart-accent, #5A6E28));
    }
    .chart-kpi-header .context {
      font-size: 15px;
      font-weight: 500;
      color: var(--kpi-label, var(--chart-muted, #6A7160));
      margin-top: 2px;
    }

    /* Donut: square viz | valued legend filling the right */
    .chart-card.donut-layout,
    .donut-layout {
      display: grid;
      grid-template-columns: 520px minmax(320px, 1fr);
      gap: 28px 40px;
      align-items: center;
      width: 100%;
    }
    .donut-viz {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 520px;
      height: 520px;
      max-width: 100%;
      flex-shrink: 0;
    }
    .donut-viz canvas {
      margin: 0 auto;
      /* Match bitmap attrs — CSS stretch of non-square buffer = oval */
      width: 520px;
      height: 520px;
      max-width: 100%;
    }
    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      text-align: center;
      z-index: 1;
    }
    .donut-center .pct {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--kpi-ink, var(--chart-ink, #3F5210));
    }
    .donut-center .lbl {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--kpi-label, var(--chart-muted, #6A7160));
      max-width: 140px;
    }

    .valued-legend {
      list-style: none;
      margin: 0;
      padding: 4px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .valued-legend li,
    .valued-legend__row {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto auto;
      gap: 12px 16px;
      align-items: center;
      font-size: 18px;
      font-weight: 500;
      color: var(--chart-ink, #0F3D3E);
    }
    /* Rank emphasis: first row strongest; rest still readable (not washed grey). */
    .valued-legend__row:first-child .valued-legend__label,
    .valued-legend li:first-child .valued-legend__label {
      font-weight: 700;
      color: var(--chart-ink, #0F3D3E);
    }
    .valued-legend__swatch {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(15, 61, 62, 0.12);
    }
    .donut-layout:has(.valued-legend.is-dense) {
      grid-template-columns: 1fr;
      gap: 24px;
      justify-items: center;
      align-items: start;
    }
    .valued-legend.is-dense {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 28px;
      width: 100%;
      max-height: none;
      overflow: visible;
    }
    .valued-legend.is-dense .valued-legend__row {
      font-size: 14px;
      gap: 8px 10px;
    }
    .valued-legend.is-dense .valued-legend__label {
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }
    .valued-legend__label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--chart-ink, #0F3D3E);
      opacity: 0.92;
    }
    .valued-legend__pct {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--kpi-ink, var(--chart-ink, #3F5210));
      min-width: 3.2em;
      text-align: right;
    }
    .valued-legend__abs {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--chart-ink, #0F3D3E);
      opacity: 0.72;
      min-width: 3em;
      text-align: right;
    }

    /* Soft KPI cards — ink from CSS vars (palette polish sets them) */
    .kpi {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 420px;
      text-align: center;
      gap: 12px;
    }
    .kpi .value {
      font-size: 88px;
      font-weight: 700;
      color: var(--kpi-value, var(--chart-accent, #5A6E28));
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .kpi .label {
      font-size: 22px;
      color: var(--kpi-label, var(--chart-muted, #3D5C60));
      margin-top: 8px;
      font-weight: 600;
    }
    .kpi-row {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      justify-content: center;
      align-items: stretch;
    }
    .kpi-row .kpi {
      min-height: 280px;
      flex: 1 1 200px;
    }
  </style>
  <script src="{{CHART_JS}}"></script>
  <script>
    if (window.Chart) {
      Chart.defaults.animation = false;
      Chart.defaults.responsive = false;
      Chart.defaults.maintainAspectRatio = false;
      Chart.defaults.devicePixelRatio = Math.max(2, window.devicePixelRatio || 2);
      Chart.defaults.font.family = '"Segoe UI", "DejaVu Sans", sans-serif';
      Chart.defaults.font.size = 17;
      Chart.defaults.font.weight = "500";
      Chart.defaults.color = "#3D5C60";
      Chart.defaults.plugins.legend.display = true;
      Chart.defaults.plugins.legend.position = "bottom";
      Chart.defaults.plugins.legend.labels.boxWidth = 16;
      Chart.defaults.plugins.legend.labels.padding = 20;
      Chart.defaults.plugins.legend.labels.font = { size: 16, weight: "500" };
      Chart.defaults.plugins.legend.labels.usePointStyle = true;
      Chart.defaults.plugins.tooltip.enabled = true;
      Chart.defaults.plugins.tooltip.backgroundColor = "rgba(26,52,48,0.92)";
      Chart.defaults.plugins.tooltip.padding = 12;
      Chart.defaults.plugins.tooltip.cornerRadius = 8;
      Chart.defaults.plugins.tooltip.displayColors = true;
      Chart.defaults.elements.bar.borderRadius = 8;
      Chart.defaults.elements.bar.borderSkipped = false;
      Chart.defaults.elements.line.borderWidth = 4;
      Chart.defaults.elements.line.tension = 0.32;
      Chart.defaults.elements.point.radius = 5;
      Chart.defaults.elements.point.hoverRadius = 7;
      Chart.defaults.elements.point.hitRadius = 10;
      Chart.defaults.scale.grid.color = "rgba(26,74,75,0.10)";
      Chart.defaults.scale.grid.lineWidth = 1.25;
      Chart.defaults.scale.grid.drawBorder = false;
      Chart.defaults.scale.border = { display: true, width: 2, color: "rgba(26,74,75,0.18)" };
      Chart.defaults.scale.ticks.padding = 8;
      Chart.defaults.scale.ticks.font = { size: 15, weight: "600" };
      if (Chart.defaults.scales && Chart.defaults.scales.category && Chart.defaults.scales.category.ticks) {
        Chart.defaults.scales.category.ticks.callback = function(val) {
          const raw = this.getLabelForValue ? this.getLabelForValue(val) : String(val ?? "");
          if (typeof raw !== "string" || raw.length <= 16 || raw.indexOf(" ") < 0) return raw;
          const mid = Math.floor(raw.length / 2);
          let best = -1;
          for (let i = 0; i < raw.length; i++) {
            if (raw[i] === " " && (best < 0 || Math.abs(i - mid) < Math.abs(best - mid))) best = i;
          }
          return best > 0 ? [raw.slice(0, best), raw.slice(best + 1)] : raw;
        };
      }
    }
  </script>
</head>
<body>
  <div id="mount">{{FRAGMENT}}</div>
</body>
</html>
