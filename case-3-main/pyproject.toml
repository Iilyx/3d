[project]
name = "case-3"
version = "0.4.0"
description = "Text → Qwen LaTeX + HTML charts → PDF/DOCX via Docker"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.40",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pillow>=10.0",
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "pypdfium2>=4.30",
  "pdfplumber>=0.11.10",
  "numpy>=1.26",
]

[project.scripts]
case3 = "case3.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
case3 = [
  "templates/*.tex",
  "templates/*.html",
  "templates/fonts/*.woff2",
  "deck_themes/*.json",
  "deck_themes/*.png",
  "deck_structures/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
